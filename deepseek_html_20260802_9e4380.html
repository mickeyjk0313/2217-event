<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 遊戲活動日曆</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0f172a; min-height: 100vh; display: flex; justify-content: center; padding: 1rem; }
    .app-wrapper { max-width: 800px; width: 100%; background: #1e293b; border-radius: 2rem; padding: 1.5rem; box-shadow: 0 20px 40px -12px #000; }
    h1 { color: #f0e9e1; font-size: 1.6rem; border-bottom: 1px solid #334155; padding-bottom: 0.8rem; margin-bottom: 1.2rem; text-align: center; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.4rem; }
    .day-header { color: #94a3b8; font-size: 0.7rem; text-align: center; padding: 0.3rem 0; font-weight: 600; }
    .day-cell { background: #2d3a4f; border-radius: 0.8rem; padding: 0.3rem; min-height: 70px; }
    .day-number { color: #e2e8f0; font-size: 0.9rem; font-weight: 600; padding-left: 0.2rem; }
    .activity-list { list-style: none; margin-top: 0.2rem; }
    .activity-list li { font-size: 0.6rem; background: #3b4a62; color: #fde9c9; padding: 0.1rem 0.4rem; border-radius: 20px; margin-bottom: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty-day { color: #475569; font-size: 0.5rem; text-align: center; padding: 0.2rem 0; }
    .footer-note { margin-top: 1.2rem; text-align: center; color: #64748b; font-size: 0.7rem; border-top: 1px solid #334155; padding-top: 1rem; }
  </style>
</head>
<body>
<div class="app-wrapper">
  <h1>🎮 遊戲活動日曆</h1>
  <div class="calendar-grid" id="calendarGrid"></div>
  <div class="footer-note">📅 7/27 ~ 8/16 · 固定活動已內建</div>
</div>
<script>
  // ✅ 正確活動資料（根據您最後確認的版本）
  const activityData = {
    "2026-07-27": ["🐻 獵熊"],
    "2026-07-28": ["❄️ 燃霜", "🎭 喬伊"],
    "2026-07-29": ["🐻 獵熊"],
    "2026-07-30": ["🎭 喬伊"],
    "2026-07-31": ["🐻 獵熊"],
    "2026-08-01": ["🏰 內部王城"],
    "2026-08-02": ["🐻 獵熊"],
    "2026-08-03": [],
    "2026-08-04": ["🐻 獵熊"],
    "2026-08-05": [],
    "2026-08-06": ["🐻 獵熊"],
    "2026-08-07": [],
    "2026-08-08": ["🐻 獵熊", "🏔️ 峽谷"],
    "2026-08-09": ["🏭 兵工廠"],
    "2026-08-10": ["🐻 獵熊"],
    "2026-08-11": ["❄️ 燃霜", "🎭 喬伊"],
    "2026-08-12": ["🐻 獵熊"],
    "2026-08-13": ["🎭 喬伊"],
    "2026-08-14": ["🐻 獵熊"],
    "2026-08-15": ["⚔️ SVS"],
    "2026-08-16": ["🐻 獵熊", "🏭 兵工廠"]
  };

  const start = new Date(2026, 6, 27);
  const end = new Date(2026, 7, 16);
  const days = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    days.push(new Date(d));
  }

  const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
  let html = '';
  for (let i = 0; i < 7; i++) {
    html += `<div class="day-header">${weekDays[i]}</div>`;
  }

  const firstDay = days[0].getDay();
  for (let i = 0; i < firstDay; i++) {
    html += `<div class="day-cell" style="background:transparent;box-shadow:none;min-height:auto;"></div>`;
  }

  for (const date of days) {
    const key = date.toISOString().slice(0, 10);
    const dayNum = date.getDate();
    const acts = activityData[key] || [];
    let listHtml = '';
    if (acts.length === 0) {
      listHtml = '<div class="empty-day">－</div>';
    } else {
      listHtml = '<ul class="activity-list">' + acts.map(a => `<li>${a}</li>`).join('') + '</ul>';
    }
    html += `
      <div class="day-cell">
        <div class="day-number">${dayNum}</div>
        ${listHtml}
      </div>
    `;
  }

  document.getElementById('calendarGrid').innerHTML = html;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 遊戲活動日曆</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1.5rem;
    }

    .app-wrapper {
      max-width: 1100px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      padding: 2rem 1.8rem 2rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
      border: 1px solid #e2e8f0;
    }

    /* 標題列 + 月份切換 */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.8rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    h1 {
      font-size: 1.8rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #f1f5f9;
      padding: 0.3rem 1rem;
      border-radius: 40px;
    }

    .month-nav button {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #334155;
      font-weight: 600;
      padding: 0 0.3rem;
      transition: 0.15s;
      line-height: 1;
    }

    .month-nav button:hover {
      color: #0f172a;
      transform: scale(1.1);
    }

    .month-nav .month-label {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0f172a;
      min-width: 120px;
      text-align: center;
    }

    /* 星期標頭 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }

    .day-header {
      font-weight: 600;
      font-size: 0.85rem;
      text-align: center;
      color: #64748b;
      padding: 0.5rem 0;
      background: #f8fafc;
      border-radius: 30px;
    }

    /* 日期格 */
    .day-cell {
      background: #f8fafc;
      border-radius: 1rem;
      padding: 0.4rem 0.3rem 0.3rem;
      min-height: 80px;
      border: 1px solid #e2e8f0;
      transition: 0.1s ease;
    }

    .day-cell.other-month {
      opacity: 0.35;
    }

    .day-cell.today {
      border: 2px solid #3b82f6;
      background: #eff6ff;
    }

    .day-number {
      font-weight: 600;
      font-size: 0.9rem;
      color: #0f172a;
      padding-left: 0.3rem;
      margin-bottom: 0.2rem;
    }

    .activity-list {
      list-style: none;
      padding: 0 0.1rem;
    }

    .activity-list li {
      font-size: 0.65rem;
      background: #dbeafe;
      color: #1e3a5f;
      padding: 0.1rem 0.4rem;
      border-radius: 30px;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 2px solid #3b82f6;
      font-weight: 500;
    }

    .empty-day {
      color: #94a3b8;
      font-size: 0.55rem;
      text-align: center;
      padding: 0.2rem 0;
    }

    .footer-note {
      margin-top: 1.8rem;
      text-align: center;
      color: #94a3b8;
      font-size: 0.75rem;
      border-top: 1px solid #e2e8f0;
      padding-top: 1rem;
    }

    /* 手機版調整 */
    @media (max-width: 600px) {
      .app-wrapper { padding: 1rem; }
      .day-cell { min-height: 65px; padding: 0.2rem; }
      .day-number { font-size: 0.75rem; }
      .activity-list li { font-size: 0.55rem; }
      .month-nav .month-label { font-size: 1rem; min-width: 90px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <!-- 標題 + 月份切換 -->
  <div class="header-row">
    <h1>🎮 活動日曆</h1>
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <span class="month-label" id="monthLabel">2026年8月</span>
      <button id="nextMonth">›</button>
    </div>
  </div>

  <!-- 日曆主體 -->
  <div class="calendar-grid" id="calendarGrid"></div>
  <div class="footer-note">📅 點擊月份切換 · 固定活動已內建至 2026/12</div>
</div>

<script>
  // ============================================================
  //  ✅ 正確活動資料（7/27 ~ 12/31，根據您確認的規則）
  // ============================================================

  // ---------- 工具：產生活動 ----------
  function buildActivityMap() {
    const map = {};

    function add(date, act) {
      const key = date.toISOString().slice(0, 10);
      if (!map[key]) map[key] = [];
      if (!map[key].includes(act)) map[key].push(act);
    }

    function clone(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

    const end = new Date(2026, 11, 31);

    // 1. 獵熊：7/27 起 +2天
    for (let d = new Date(2026, 6, 27); d <= end; d.setDate(d.getDate() + 2)) {
      add(clone(d), '🐻 獵熊');
    }

    // 2. 燃霜：每隔2週 週二，7/28 起
    for (let d = new Date(2026, 6, 28); d <= end; d.setDate(d.getDate() + 14)) {
      if (d.getDay() === 2) add(clone(d), '❄️ 燃霜');
    }

    // 3. 喬伊：每隔2週 週二&週四，7/28、7/30 起
    for (let d = new Date(2026, 6, 28); d <= end; d.setDate(d.getDate() + 14)) {
      if (d.getDay() === 2 || d.getDay() === 4) add(clone(d), '🎭 喬伊');
    }

    // 4. 內部王城：每隔4週 週六，8/1 起
    for (let d = new Date(2026, 7, 1); d <= end; d.setDate(d.getDate() + 28)) {
      if (d.getDay() === 6) add(clone(d), '🏰 內部王城');
    }

    // 5. SVS：每隔4週 週六，7/18 起
    for (let d = new Date(2026, 6, 18); d <= end; d.setDate(d.getDate() + 28)) {
      if (d.getDay() === 6) add(clone(d), '⚔️ SVS');
    }

    // 6. 峽谷：每隔4週 週六，7/11 起
    for (let d = new Date(2026, 6, 11); d <= end; d.setDate(d.getDate() + 28)) {
      if (d.getDay() === 6) add(clone(d), '🏔️ 峽谷');
    }

    // 7. 兵工廠：每隔2週 週日，7/26 起
    for (let d = new Date(2026, 6, 26); d <= end; d.setDate(d.getDate() + 14)) {
      if (d.getDay() === 0) add(clone(d), '🏭 兵工廠');
    }

    return map;
  }

  const activityMap = buildActivityMap();

  // ============================================================
  //  渲染日曆（支援月份切換）
  // ============================================================

  let currentYear = 2026;
  let currentMonth = 7; // 8月

  const grid = document.getElementById('calendarGrid');
  const label = document.getElementById('monthLabel');

  function render(year, month) {
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const daysInMonth = last.getDate();
    const startDay = first.getDay(); // 0=日

    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);

    let html = '';

    // 星期頭
    const week = ['日', '一', '二', '三', '四', '五', '六'];
    for (let i = 0; i < 7; i++) {
      html += `<div class="day-header">${week[i]}</div>`;
    }

    // 補空白
    for (let i = 0; i < startDay; i++) {
      html += `<div class="day-cell other-month" style="background:transparent;border:none;min-height:auto;box-shadow:none;"></div>`;
    }

    // 每一天
    for (let d = 1; d <= daysInMonth; d++) {
      const dateObj = new Date(year, month, d);
      const key = dateObj.toISOString().slice(0, 10);
      const dayNum = d;

      const acts = activityMap[key] || [];
      const isToday = (key === todayStr);

      let listHtml = '';
      if (acts.length === 0) {
        listHtml = `<div class="empty-day">－</div>`;
      } else {
        const items = acts.map(a => `<li>${a}</li>`).join('');
        listHtml = `<ul class="activity-list">${items}</ul>`;
      }

      const todayClass = isToday ? 'today' : '';
      html += `
        <div class="day-cell ${todayClass}">
          <div class="day-number">${dayNum}</div>
          ${listHtml}
        </div>
      `;
    }

    grid.innerHTML = html;
    label.textContent = `${year}年${month + 1}月`;
  }

  // 切換月份
  document.getElementById('prevMonth').addEventListener('click', () => {
    if (currentMonth === 0) {
      currentMonth = 11;
      currentYear--;
    } else {
      currentMonth--;
    }
    // 不允許小於 2026/7
    if (currentYear < 2026 || (currentYear === 2026 && currentMonth < 6)) {
      currentMonth = 6;
      currentYear = 2026;
    }
    render(currentYear, currentMonth);
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    if (currentMonth === 11) {
      currentMonth = 0;
      currentYear++;
    } else {
      currentMonth++;
    }
    // 不允許超過 2026/12
    if (currentYear > 2026 || (currentYear === 2026 && currentMonth > 11)) {
      currentMonth = 11;
      currentYear = 2026;
    }
    render(currentYear, currentMonth);
  });

  // 初始渲染：2026年8月
  render(2026, 7);
</script>
</body>
</html>
